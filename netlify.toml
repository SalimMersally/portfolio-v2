[build]
  base    = "portfolio"
  command = "node scripts/generate-sitemap.mjs && ng build"
  publish = "dist/portfolio-v2/browser"

# Canonical: www → apex — must come before the SPA catch-all
[[redirects]]
  from   = "https://www.salimalmersally.com/*"
  to     = "https://salimalmersally.com/:splat"
  status = 301
  force  = true

# Angular client-side routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache: index.html always revalidated
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Cache: hashed assets are immutable
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
