@if (data(); as d) {
  <main class="work-main">
    <div class="container">
      <header class="work-hero">
        <div class="work-hero-main">
          <div class="work-hero-left">
            <p class="work-kicker">Portfolio</p>
            <h1 class="work-title">Experience &amp; Work</h1>
            <p class="work-sub">The technical deep-dive — roles, projects, skills, and education.</p>
          </div>
          <a [href]="d.profile.cvUrl" download target="_blank" rel="noopener" class="work-resume-link">
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14,2 14,8 20,8" />
              <line x1="12" y1="11" x2="12" y2="17" />
              <polyline points="9,14 12,17 15,14" />
            </svg>
            Download resume
          </a>
        </div>
      </header>
    </div>

    <app-experience [experiences]="d.experiences" />
    <app-projects [projects]="d.projects" />
    <app-skills [groups]="d.skills" />
    <app-education [items]="d.education" />
    <app-books [books]="d.books" />
  </main>
} @else {
  <app-loading-dots [fullHeight]="true" />
}
