<section class="section about" id="about">
  <div class="container">
    <div class="about-layout">
      <div class="about-photo-wrap" appReveal>
        <img
          class="about-photo"
          [src]="about().photoUrl"
          alt="Salim Al Mersally"
          width="746"
          height="746"
          loading="lazy"
        />
      </div>

      <div class="about-content" appReveal="1">
        <p class="section-label">About Salim</p>
        <h2 class="section-title">Thoughtful software starts with understanding the problem.</h2>
        <p class="about-bio">{{ about().bio }}</p>

        @if (about().highlights.length) {
          <div class="about-highlights">
            @for (highlight of about().highlights; track $index) {
              <div class="about-highlight">
                <strong>{{ highlight.value }}</strong>
                <span>{{ highlight.label }}</span>
              </div>
            }
          </div>
        }

        <a routerLink="/work" class="about-work-link">View technical experience →</a>
      </div>
    </div>
  </div>
</section>
