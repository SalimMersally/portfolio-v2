<section class="section contact-section" id="contact">
  <div class="container">
    <p class="section-label" appReveal>Start a conversation</p>
    <h2 class="section-title" appReveal="1">Have an idea? Let’s make the next step clear.</h2>

    @if (profile(); as currentProfile) {
      <div class="contact-layout" appReveal="2">
        <div class="contact-info">
          <p>{{ currentProfile.contactIntro }}</p>

          <a [href]="instagramHref()" target="_blank" rel="noopener" class="contact-primary"
            >Message me on Instagram ↗</a
          >

          <a [href]="'mailto:' + currentProfile.email" class="contact-email">
            {{ currentProfile.email }}
          </a>

          <div class="contact-socials">
            <a [href]="currentProfile.github" target="_blank" rel="noopener">GitHub ↗</a>
            <a [href]="currentProfile.linkedin" target="_blank" rel="noopener">LinkedIn ↗</a>
          </div>
        </div>

        <form class="contact-form" id="contact-form" (ngSubmit)="sendMessage()" novalidate>
          <div class="contact-field">
            <label for="contact-name">Name</label>
            <input
              id="contact-name"
              type="text"
              placeholder="Your name"
              [value]="name()"
              (input)="name.set($any($event.target).value)"
              required
              autocomplete="name"
            />
          </div>
          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input
              id="contact-email"
              type="email"
              placeholder="your@email.com"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
              required
              autocomplete="email"
            />
          </div>
          <div class="contact-field">
            <label for="contact-message">Project or idea</label>
            <textarea
              id="contact-message"
              placeholder="What are you trying to build or improve?"
              [value]="message()"
              (input)="message.set($any($event.target).value)"
              rows="5"
              required
            ></textarea>
          </div>
          <button
            type="submit"
            class="contact-submit"
            [disabled]="!name() || !email() || !message()"
          >
            Open email app →
          </button>
          <p class="contact-note">This opens your email app with the message filled in.</p>
        </form>
      </div>
    }
  </div>
</section>
