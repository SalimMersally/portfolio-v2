<section class="section" id="services">
  <div class="container">
    <p class="section-label" appReveal>Services</p>
    <h2 class="section-title" appReveal="1">What I Can Build For You</h2>
    <div class="section-divider" appReveal="2"></div>

    <div class="services-grid">
      @for (s of services(); track s._id; let i = $index) {
        <div class="service-card" [appReveal]="((i % 4) + 1).toString()">
          <span class="service-tag">Service</span>
          <h3 class="service-title">{{ s.title }}</h3>
          <p class="service-description">{{ s.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
